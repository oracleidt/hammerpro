[package]
name = "hp-update"
description = "Hammer Pro auto update: GitHub release check, download, zip extraction and the helper that replaces the program."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde_json = "1"
flate2 = "1"
sha2 = "0.11"
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_Threading",
] }
