[package]
name = "hp-app"
description = "Hammer Pro application core: shared state, i18n, settings, actions, view math, tool interface."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hp-vmf.workspace = true
hp-geom.workspace = true
hp-vmt.workspace = true
hp-fgd.workspace = true
hp-fs.workspace = true
hp-render.workspace = true
hp-editor.workspace = true
hp-kv.workspace = true
hp-sniffer = { path = "../hp-sniffer" }
hp-colorgrade = { path = "../hp-colorgrade" }
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
glam = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = "1"
toml.workspace = true
dirs.workspace = true
log.workspace = true
parking_lot.workspace = true
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
