[package]
name = "hammerpro"
description = "Hammer Pro: a modern, fast level editor for Source engine maps (Garry's Mod first)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "hammerpro"

[[bin]]
name = "hammerpro"
path = "src/main.rs"

[dependencies]
hp-app = { path = "../hp-app" }
hp-assets = { path = "../hp-assets" }
hp-nav = { path = "../hp-nav" }
hp-ui-shell = { path = "../hp-ui-shell" }
hp-ui-viewports = { path = "../hp-ui-viewports" }
hp-tools-select = { path = "../hp-tools-select" }
hp-tools-create = { path = "../hp-tools-create" }
hp-tools-mesh = { path = "../hp-tools-mesh" }
hp-tools-physics = { path = "../hp-tools-physics" }
hp-ui-textures = { path = "../hp-ui-textures" }
hp-shader = { path = "../hp-shader" }
hp-ui-entities = { path = "../hp-ui-entities" }
hp-ui-mapping = { path = "../hp-ui-mapping" }
hp-light = { path = "../hp-light" }
hp-ui-lab = { path = "../hp-ui-lab" }
hp-audio = { path = "../hp-audio" }
hp-colorgrade = { path = "../hp-colorgrade" }
hp-sniffer = { path = "../hp-sniffer" }
hp-decompile = { path = "../hp-decompile" }
hp-mcp = { path = "../hp-mcp" }
hp-pcf = { path = "../hp-pcf" }
hp-discord = { path = "../hp-discord" }
hp-update = { path = "../hp-update" }
hp-editor.workspace = true
hp-vmf.workspace = true
hp-kv.workspace = true
hp-geom.workspace = true
hp-fgd.workspace = true
hp-fs.workspace = true
hp-vmt.workspace = true
hp-compile.workspace = true
hp-bsp.workspace = true
hp-bspc.workspace = true
hp-mdl.workspace = true
hp-meshio.workspace = true
hp-render.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
glam.workspace = true
log.workspace = true
rfd.workspace = true
image.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json = "1"
arboard = "3"
hp-vtf.workspace = true

[dev-dependencies]
pollster.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
