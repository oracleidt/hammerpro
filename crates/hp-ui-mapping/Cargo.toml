[package]
name = "hp-ui-mapping"
description = "Hammer Pro visgroups, outliner, compile dialog, problems, transform and map dialogs."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hp-app = { path = "../hp-app" }
getrandom = "0.3"
hp-editor.workspace = true
hp-render.workspace = true
hp-geom.workspace = true
hp-vmf.workspace = true
hp-fgd.workspace = true
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
glam.workspace = true
log.workspace = true
hp-compile.workspace = true
hp-fs.workspace = true
hp-bsp.workspace = true
hp-gma.workspace = true
hp-mdl.workspace = true
hp-vpk.workspace = true
hp-vtf.workspace = true
hp-vmt.workspace = true
hp-meshio.workspace = true
image.workspace = true
rayon.workspace = true
serde.workspace = true
toml.workspace = true
rfd.workspace = true
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
