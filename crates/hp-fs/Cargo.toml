[package]
name = "hp-fs"
description = "Game filesystem and asset index for Hammer Pro: gameinfo, VPKs, mount.cfg, addons, workshop GMAs and custom texture folders."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hp-kv.workspace = true
hp-vpk.workspace = true
hp-gma.workspace = true
hp-vtf.workspace = true
hp-vmt.workspace = true
hp-mdl.workspace = true
hp-bsp.workspace = true
thiserror.workspace = true
rayon.workspace = true
parking_lot.workspace = true
ahash.workspace = true
image.workspace = true
log.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
rayon.workspace = true
