[package]
name = "hp-sniffer"
description = "BSP Sniffer: launches Garry's Mod, joins a server and recovers the loaded map from the game memory into a BSP and a VMF (Garry's Mod only)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hp-bsp.workspace = true
hp-decompile = { path = "../hp-decompile" }
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
memchr.workspace = true
log.workspace = true
ahash.workspace = true
rayon.workspace = true
parking_lot.workspace = true
dirs.workspace = true
hp-gma.workspace = true
hp-fs.workspace = true
hp-editor.workspace = true
hp-vpk.workspace = true
hp-vmf.workspace = true
hp-geom.workspace = true
glam.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
memmap2.workspace = true
